server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=10s;
    set $api http://api:3001;
    client_max_body_size 32m;
    add_header X-Content-Type-Options nosniff always;

    location = /frontend-health {
        access_log off;
        return 200 "ok\n";
    }
    location ~ ^/(api(?:/|$)|mcp(?:/|$)) {
        # Dynamic DNS lets static Vue start and stay available while API is stopped.
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $http_host;
    }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; worker-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
