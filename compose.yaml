services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_DB: cce
      POSTGRES_USER: cce
      POSTGRES_PASSWORD: cce
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - cce-postgres:/var/lib/postgresql

volumes:
  cce-postgres:
